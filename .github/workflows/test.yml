name: test

on:
  push:
  pull_request:

# Jeton en LECTURE SEULE par defaut. Un job qui doit ecrire (publication)
# redeclare ses propres permissions a son niveau, ou il herite de celles-ci.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Sans plafond, un job bloque consomme jusqu'a la limite du fournisseur (6 h).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # VALIDATION STATIQUE DU WGSL. C'est le SEUL gate de shader qui puisse
      # tourner ici : `test:gpu-shaders` et `test:render` exigent un GPU et une
      # fenetre WebView2, donc restent locaux. Sans cette etape,
      # `test/render/wgslNaga.test.ts` echoue faute de binaire — volontairement,
      # plutot que de se taire et de laisser croire a une couverture.
      - name: Cache naga-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/naga
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: naga-cli-30.0.0-${{ runner.os }}

      - name: Install naga-cli
        run: command -v naga || cargo install naga-cli --locked --version 30.0.0

      - name: Run unit tests
        run: npm run test

      - name: Run Storybook tests
        run: npm run test-storybook
