name: test

on:
  push:
  pull_request:

# Jeton en LECTURE SEULE par defaut. Un job qui doit ecrire (publication)
# redeclare ses propres permissions a son niveau, ou il herite de celles-ci.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Sans plafond, un job bloque consomme jusqu'a la limite du fournisseur (6 h).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test

      - name: Run Storybook tests
        run: npm run test-storybook
